<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script type="text/javascript">
        function example()
        {
            var n1=parseInt(document.getElementById("t1").value);
            var n2=parseInt(document.getElementById("t2").value);
            var res=" ";
            for(var i=n1;i<=n2;i++)
        {
            if(i<=20)
            continue;
            else
            res=res+i+" ";
        }
        document.getElementById("ans").innerHTML=res;
            
        }
        function example1()
        {
            var n1=parseInt(document.getElementById("d1").value);
            var n2=parseInt(document.getElementById("d2").value);
            var res=" ";
            for(var i=n1;i<=n2;i++)
        {
            if(i>=20)
            break;
            else
            res=res+i+" ";
        }
        document.getElementById("ans1").innerHTML=res;
            
        }
        
    </script>
</head>
<body>
    <h1><center>JUMPING STATEMENT</center></h1>
    <h1>1.CONTINUE</h1>
    <input type="text" id="t1" placeholder="ENTER NUM 1"><br>
    <input type="text" id="t2" placeholder="ENTER NUM 2"><br>
    <input type="button" value="CONTINUE" onclick="example()">
    <div id="ans"></div>



    <h1>2.BREAK(>=20)</h1>
    <input type="text" id="d1" placeholder="ENTER NUM 1"><br>
    <input type="text" id="d2" placeholder="ENTER NUM 2"><br>
    <input type="button" value="BREAK" onclick="example1()">
    <div id="ans1"></div>

    
</body>
</html>
