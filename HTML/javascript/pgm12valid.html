<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script type="text/javascript">

        function show()
        {
            var a=document.getElementById("t1").value;
            var re=/^[A-Z]{4,12}$/;
            if(a.match(re))
            alert("VALID");
            else
            alert("NOT VALID")
        }
    </script>
</head>
<body>
    <h1><center>REGULAR EXPRESSION 1.NAME VALIDATION(ONLY CAPS,MIN:4,MAX:12)</center></h1>
    <input type="text" id="t1" placeholder="ENTER UR NAME">
    <br>
    <input type="button" value="VALIDATE" onclick="Show()">
    <br>
    <div id="res"></div>
    

    
</body>
</html>
