<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script type="text/javascript">
        function display()
        {
            var n1=parseInt(document.getElementById("t1").value);
            var n2=parseInt(document.getElementById("t2").value);
            var res=" ";
            var sum=0;
            while(n1<=n2)
        {
            sum=sum+n2;
            if(n1==n2)
            res=res+n2+"";
            else
            res=res+n2+"+";
            n2--;
           
        }
       document.getElementById("ans").innerHTML=res+"="+sum;

        }

    </script>
</head>
<body>
     <h1><center>WHILE LOOP</center></h1>
    <input type="text" id="t1" placeholder="ENTER STARTING NUMBER">
    <br>
    <input type="text" id="t2" placeholder="ENTER ENDING NUMBER">
    <br>
    <input type="button" value="ANSWER" onclick="display()">
    <div id="ans"></div>
    
</body>
</html>
