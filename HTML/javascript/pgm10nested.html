<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script type="text/javascript">
   function dis()
   {
    var arr=[[10,20,30],[11,12,13],[21,22,23]];
    sum=0;
    for(var i=0;i<3;i++)
   {

        for(var j=0;j<3;j++)
        {
            sum=sum+arr[i][j];
            document.write("   "+arr[i][j]);
        }
        document.write("= "+sum+"<br>");
        sum=0;

   }
   }

    </script>
</head>
<body>
    <h1><center>NESTED ARRAY</center></h1>
    <input type="button" value="NESTED ARRAY" onclick="dis()">
</body>
</html>
