<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script type="text/javascript">
        function add()
        {
            var a= document.getElementById("t1").value;
            var b= document.getElementById("t2").value;
            var c=parseInt(a)+parseInt(b);
            
            //alert("TOTAL:"+c);
           // document.write("tot"+c);
           
            document.getElementById("res").innerHTML="total: "+c;

        }

        function resetFields()
        {
            document.getElementById("t1").value = "";
            document.getElementById("t2").value = "";
        }
    </script>
</head>

<body>
    <input type="text" id="t1" placeholder="ENTER THE NUMBER 1">
    <br>
    <input type="text" id="t2" placeholder="ENTER THE NUMBER 2">
    <br>
    <input type="button" value="ADDITION" onclick="add()">
    <input type="button" value="RESET" onclick="resetFields()">
    <div id="res"></div>
    

</body>
</html>
