<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Task Manager</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container py-4">

  <!-- Task Form -->
  <h2>Create Task</h2>
  <form id="taskForm" class="mb-4">
    <div class="mb-3">
      <label for="taskName" class="form-label">Name</label>
      <input type="text" class="form-control" id="taskName" required>
    </div>
    <div class="mb-3">
      <label for="taskDesc" class="form-label">Description</label>
      <textarea class="form-control" id="taskDesc" required></textarea>
    </div>
    <div class="mb-3">
      <label for="assignedTo" class="form-label">Assigned To</label>
      <input type="text" class="form-control" id="assignedTo" required>
    </div>
    <div class="mb-3">
      <label for="dueDate" class="form-label">Due Date</label>
      <input type="date" class="form-control" id="dueDate" required>
    </div>
    <div class="mb-3">
      <label for="status" class="form-label">Status</label>
      <select class="form-select" id="status" required>
        <option value="">Select status</option>
        <option>TODO</option>
        <option>IN PROGRESS</option>
        <option>REVIEW</option>
        <option>DONE</option>
      </select>
    </div>
    <button type="submit" class="btn btn-primary">Add Task</button>
  </form>

  <!-- Task List -->
  <h2>Task List</h2>
  <div id="taskList" class="list-group"></div>

  <script src="task.js"></script>
</body>
</html>
