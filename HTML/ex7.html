<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=<device-width>, initial-scale=1.0">
    <title>Document</title>
    <style type="text/css">
#head1
{
    background-color:lightgreen;
    color:black;
   text-align: center;
}
#head2
{
    background-color: purple;
    color: black;
    text-align: center;
}
.head3
{
    background-color: pink;
    color: black;
    text-align: center;
}

 </style>
</head>
<body>
    
   <h1 id="head1">THIS IS GREEN COLOR</h1>
   <h1 id="head2">THIS IS PURPLE COLOR</h1>
   <h1 class="head3">THIS IS PINK COLOR</h1>
   <!--id attribute: we can apply diff styles for same tag-->
</body>
</html>
