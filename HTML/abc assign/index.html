<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ABC Challenge</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <main class="page-shell">
        <header class="hero">
            <p class="eyebrow">Group Challenge</p>
            <h1>ABC Gallery</h1>
            <p class="intro">Explore three bright snapshots of the alphabet.</p>
        </header>

        <section class="gallery" aria-label="ABC pictures">
            <article class="letter-card">
                <img src="https://images.unsplash.com/photo-1526778548025-fa2f459cd5c1?auto=format&fit=crop&w=900&q=85" alt="Aerial view of a winding road shaped like a letter-like curve">
                <div class="card-content">
                    <h2>A</h2>
                    <h3>Adventure</h3>
                    <h5 tabindex="0" role="button" aria-label="Change Adventure colour">Click to change my colour</h5>
                </div>
            </article>

            <article class="letter-card">
                <img src="https://images.unsplash.com/photo-1500534623283-312aade485b7?auto=format&fit=crop&w=900&q=85" alt="Blue mountain landscape under a bright sky">
                <div class="card-content">
                    <h2>B</h2>
                    <h3 class="blue-heading">Balance</h3>
                    <h5 tabindex="0" role="button" aria-label="Change Balance colour">Click to change my colour</h5>
                </div>
            </article>

            <article class="letter-card">
                <img src="https://images.unsplash.com/photo-1473448912268-2022ce9509d8?auto=format&fit=crop&w=900&q=85" alt="Green forest with sunlight shining between the trees">
                <div class="card-content">
                    <h2>C</h2>
                    <h3 class="blue-heading">Curiosity</h3>
                    <h5 tabindex="0" role="button" aria-label="Change Curiosity colour">Click to change my colour</h5>
                </div>
            </article>
        </section>

        <section class="summary" aria-label="Challenge notes">
            <h3 class="blue-heading">Create. Explore. Learn.</h3>
            <p>Every click gives the challenge a new colour.</p>
        </section>
    </main>
</body>
</html>
