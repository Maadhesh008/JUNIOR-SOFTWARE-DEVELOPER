<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <title>Document</title>
</head>
<body>
    <button class="btn btn-outline-success">clickme</button>
    <button class="btn btn-danger">clickme</button>
    <button class="btn btn-info">clickme</button>
    <button class="btn btn-primary">clickme</button>
    <button class="btn btn-warning">clickme</button>
    <button class="btn btn-secondary">clickme</button>
    <button class="btn btn-light">clickme</button>
    <button class="btn btn-dark">clickme</button>
    <button class="btn btn-link">clickme</button><br>
    <h1>==================================================</h1><br
<h1><center>BLOCK BUTTON</center></h1>
    <div class="d-grid gap-1">
         <button class="btn btn-success">clickme</button>
    <button class="btn btn-danger">clickme</button>
    <button class="btn btn-info">clickme</button>
    <button class="btn btn-primary">clickme</button>
    <button class="btn btn-warning">clickme</button>
    <br>
     </div>
    <h1>==================================================</h1><br>
    <h2><center>CHECKBOX BUTTON- multiple selection</center></h2><br>
    <div class="btn-group">
        <input class="btn-check" type="checkbox" id="ch1">
        <label for="ch1" class="btn btn-outline-info">C language</label>
        <input class="btn-check" type="checkbox" id="ch2">
        <label for="ch2" class="btn btn-outline-info">C++ language</label>
        <input class="btn-check" type="checkbox" id="ch3">
        <label for="ch3" class="btn btn-outline-info">Java language</label>
        <input class="btn-check" type="checkbox" id="ch4">
        <label for="ch4" class="btn btn-outline-info">Python language</label>
    </div>
<h1>==================================================</h1><br>
   <h1><center>RADIO BUTTON- single selection</center></h1>
   <div class="btn-group">

    <input class="btn-check" name="gender" type="radio" id="r1">
    <label for="r1" class="btn btn-outline-info">Male</label>
    <input class="btn-check" name="gender" type="radio" id="r2">
    <label for="r2" class="btn btn-outline-info">Female</label>
    <input class="btn-check" name="gender" type="radio" id="r3">
    <label for="r3" class="btn btn-outline-info">Other</label>

   </div>

</body>
</html>
